name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release zip
        run: |
          NAME="AteneaUI-${{ github.ref_name }}.zip"
          zip -r "$NAME" atenea bot.py requirements.txt start_bot.bat start_bot_loop.bat README.md \
            -x "atenea/__pycache__/*" "**/.DS_Store" "**/.venv/*" "**/.trae/*" "**/.vscode/*" "**/logs/*" "**/*.log" "**/.env"
          echo "ZIP_NAME=$NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
