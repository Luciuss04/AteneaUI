name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff
        run: |
          ruff check atenea bot.py

      - name: Mypy
        run: |
          mypy atenea bot.py --ignore-missing-imports

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib
          mods = [
              'bot',
              'atenea.commands.music',
              'atenea.commands.config',
              'atenea.commands.license',
              'atenea.music.player',
              'atenea.music.youtube',
              'atenea.music.spotify',
              'atenea.config.manager',
              'atenea.license.manager',
          ]
          for m in mods:
              importlib.import_module(m)
          print('smoke ok')
          PY
