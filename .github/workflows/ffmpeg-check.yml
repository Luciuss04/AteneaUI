name: FFmpeg Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: ffmpeg -version
